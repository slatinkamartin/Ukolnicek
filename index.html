<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moje úkoly</title>
</head>
<body>
<style>
:root {
  --bg:#f2f2f7; --karta:#fff; --text:#000; --sedy:#6d6d72; --sedy2:#8e8e93; --pole:#f2f2f7;
  --cara:#d1d1d6; --cara2:#e5e5ea; --akcent:#007aff; --cerv:#ff3b30; --zel:#34c759; --oranz:#ff9500;
  --segment:#e3e3e8; --segaktiv:#fff; --vikend:#f7f7fa; --stin:0 1px 3px rgba(0,0,0,.10);
  color-scheme: light;
}
:root[data-tema="tmavy"] {
  --bg:#000; --karta:#1c1c1e; --text:#fff; --sedy:#a1a1a6; --sedy2:#8e8e93; --pole:#2c2c2e;
  --cara:#38383a; --cara2:#2c2c2e; --akcent:#0a84ff; --cerv:#ff453a; --zel:#30d158; --oranz:#ff9f0a;
  --segment:#2c2c2e; --segaktiv:#636366; --vikend:#242426; --stin:none;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-tema="auto"] {
    --bg:#000; --karta:#1c1c1e; --text:#fff; --sedy:#a1a1a6; --sedy2:#8e8e93; --pole:#2c2c2e;
    --cara:#38383a; --cara2:#2c2c2e; --akcent:#0a84ff; --cerv:#ff453a; --zel:#30d158; --oranz:#ff9f0a;
    --segment:#2c2c2e; --segaktiv:#636366; --vikend:#242426; --stin:none;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px 14px 90px; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  font-size: 17px; -webkit-text-size-adjust: 100%;
}
#aplikace { max-width: 1100px; margin: 0 auto; }
.hl-app { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 14px; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
button, input, select, textarea { font-family: inherit; color: var(--text); }

.segment { display: flex; background: var(--segment); border-radius: 10px; padding: 2px; margin-bottom: 12px; }
.segment button { flex: 1; border: none; background: transparent; padding: 8px 4px; font-size: 15px; border-radius: 8px; color: var(--text); }
.segment button.aktivni { background: var(--segaktiv); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.segment.mala button { font-size: 14px; padding: 6px 4px; }

.karta { background: var(--karta); border-radius: 14px; margin: 12px 0; overflow: hidden; box-shadow: var(--stin); }
.hlavicka { display: flex; align-items: center; gap: 10px; padding: 14px; cursor: pointer; }
.telo { background: var(--bg); padding: 12px 12px 2px; }
.panel { background: var(--karta); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--stin); }
.projekt { padding: 14px; }
.projekty-mrizka { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; margin-bottom: 12px; }
.projekty-mrizka .panel { margin-bottom: 0; }
.polozka { border-top: .5px solid var(--cara2); }
.popisek { font-size: 13px; color: var(--sedy); text-transform: uppercase; letter-spacing: .3px; margin: 0 0 8px 2px; }

.pole { width: 100%; font-size: 17px; padding: 11px 12px; border: none; border-radius: 10px; background: var(--pole); margin-bottom: 8px; -webkit-appearance: none; appearance: none; }
textarea.pole { min-height: 110px; }
.mini { font-size: 16px; padding: 8px 10px; border: none; border-radius: 8px; background: var(--pole); }

.btn { border: none; background: none; color: var(--akcent); font-size: 17px; padding: 8px 6px; }
.btn:disabled { color: var(--sedy2); }
.btn-plny { border: none; background: var(--akcent); color: #fff; font-size: 17px; font-weight: 600; padding: 11px 18px; border-radius: 12px; margin-right: 6px; }
.btn-cerv { color: var(--cerv); }
.ikona { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--cara2); color: var(--sedy2); font-size: 13px; font-weight: 700; padding: 0; flex-shrink: 0; }
.kolecko { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #c7c7cc; background: transparent; color: #fff; font-size: 15px; line-height: 1; padding: 0; flex-shrink: 0; }
.kolecko.hotovo { background: var(--akcent); border-color: var(--akcent); }

.progress { height: 8px; background: var(--cara2); border-radius: 4px; overflow: hidden; }
.progress div { height: 100%; border-radius: 4px; }
.stitek { display: inline-block; border: none; border-radius: 16px; padding: 7px 14px; font-size: 15px; font-weight: 600; white-space: nowrap; }

.barva-kolo { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--karta); box-shadow: 0 0 0 1px var(--cara); padding: 0; overflow: hidden; background: none; flex-shrink: 0; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border: none; border-radius: 50%; }

.tah { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: grab; }
.drop-cil { outline: 2px dashed var(--akcent); outline-offset: -2px; }

#sheet { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: flex-end; justify-content: center; }
#sheet.otevreno { display: flex; }
.sheet-panel { background: var(--bg); width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; -webkit-overflow-scrolling: touch; }
.sheet-hl { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; position: sticky; top: 0; background: var(--bg); z-index: 2; border-bottom: .5px solid var(--cara); }
.sheet-tel { padding: 12px; }
@media (min-width: 700px) { #sheet { align-items: center; } .sheet-panel { border-radius: 16px; } }

.segment.hlavni { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.segment.hlavni button { flex: 1 0 auto; padding: 8px 11px; font-size: 14px; white-space: nowrap; }
.rychly { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.rychly .pole { margin: 0; flex: 1; min-width: 0; }
.rychly .btn-plny { margin: 0; padding: 11px 14px; }
.nahled { font-size: 13px; color: var(--sedy); min-height: 18px; margin: 2px 4px 10px; }
.plan-mrizka { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
@media (min-width: 900px) { .plan-mrizka { grid-template-columns: minmax(280px, 2fr) 3fr; } }
.tray { max-height: 300px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
@media (min-width: 900px) { .tray { max-height: 560px; } }
.obsazeno { background: repeating-linear-gradient(45deg, rgba(142,142,147,.38), rgba(142,142,147,.38) 4px, rgba(142,142,147,.16) 4px, rgba(142,142,147,.16) 8px); }
.mit-slot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; background: var(--pole); border: 2px solid transparent; }
.mit-slot.plny { border-color: #ffcc00; background: rgba(255,204,0,.14); }
.maly-btn { border: none; background: var(--cara2); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 14px; }

#toast { display: none; position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #3a3a3c; color: #fff; border-radius: 14px; padding: 10px 16px; align-items: center; gap: 16px; z-index: 1500; box-shadow: 0 4px 14px rgba(0,0,0,.3); max-width: 92vw; }
</style>

<div id="aplikace">
  <div class="hl-app">
    <h1>Moje úkoly</h1>
    <button id="btnUndo" class="btn">↶ Zpět</button>
  </div>

  <div class="rychly">
    <input id="rychly" class="pole" placeholder="＋ Rychlý zápis: zítra 14:00 zavolat Novák 30min #Práce" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
    <button id="rychlyBtn" class="btn-plny">Přidat</button>
  </div>
  <div id="rychlyNahled" class="nahled"></div>

  <div class="segment hlavni">
    <button id="btnPrehled">Přehled</button>
    <button id="btnPlan">Plán</button>
    <button id="btnInbox">Inbox</button>
    <button id="btnSeznam">Seznam</button>
    <button id="btnKalendar">Kalendář</button>
    <button id="btnRevize">Revize</button>
    <button id="btnNastaveni">⚙︎</button>
  </div>

  <input id="hledat" type="search" class="pole" placeholder="🔍 Hledat v akcích…">

  <div id="filtrBox">
    <div class="popisek">Filtr podle priority projektů</div>
    <div id="filtr" class="segment mala"></div>
  </div>

  <div id="vysledky"></div>

  <div id="prehledPohled"><div id="prehled"></div></div>

  <div id="seznamPohled">
    <div class="karta" style="padding:14px">
      <div class="popisek">Nová oblast zájmu</div>
      <div style="display:flex;gap:10px;align-items:center">
        <input id="nazevOblasti" class="pole" placeholder="Název oblasti" style="margin:0">
        <input id="barvaOblasti" type="color" class="barva-kolo" value="#007aff">

    </div>
    <div id="oblasti"></div>
  </div>

  <div id="planPohled"><div id="plan"></div></div>
  <div id="inboxPohled"><div id="inbox"></div></div>
  <div id="revizePohled"><div id="revize"></div></div>

  <div id="kalendarPohled"><div id="kalendar"></div></div>
  <div id="nastaveniPohled"><div id="nastaveni"></div></div>
</div>

<div id="sheet"></div>
<div id="toast"></div>

<script>
/* =====================  STAV  ===================== */
let oblasti = [];
try { oblasti = JSON.parse(localStorage.getItem("oblasti") || "[]"); } catch (e) { oblasti = []; }
if (!Array.isArray(oblasti)) oblasti = [];

let otevrena = null;      // právě otevřená oblast (vždy jedna)
let filtrPriorita = "";   // "" = všechny priority
let formProjekt = null;   // oblast, u které je otevřený formulář nového projektu
let prejmenovani = null;  // oblast nebo projekt, který se právě přejmenovává
let editor = null;        // stav okna pro úpravu akce
let pohled = "prehled";   // prehled | seznam | kalendar | nastaveni
let kalPohled = "mesic";  // mesic | tyden | den
let kDen = dnesKlic();    // referenční den kalendáře
let vybranyDen = kDen;    // vybraný den v měsíčním pohledu
let kalScroll = 7 * 48;   // posun časové osy
let dotaz = "";           // hledaný text
let tema = "auto";
try { tema = localStorage.getItem("tema") || "auto"; } catch (e) {}
let undoZasobnik = [];
let toastTimer = null;
let blokKlik = false;
let planDen = dnesKlic();     // den zobrazený v záložce Plán
let formSablona = null;       // oblast, u které je otevřený formulář „projekt ze šablony“
let uzaverkaOtevrena = null;  // null = podle času (po pracovní době se otevře sama)
let nidCislo = 0;
let cloud = { nastaveni: { url: "", key: "" }, klient: null, uzivatel: null, stav: "", verze: 0, bezi: false, znovu: false, timer: null, blok: false, pozastaveno: false };
try {
  const c = JSON.parse(localStorage.getItem("cloud") || "null");
  if (c && c.url && c.key) cloud.nastaveni = { url: String(c.url), key: String(c.key) };
} catch (e) {}
let meta = vychoziMeta();
let sablony = [];
try { meta = slucMeta(JSON.parse(localStorage.getItem("meta") || "null")); } catch (e) { meta = vychoziMeta(); }
try {
  const ulozene = localStorage.getItem("sablony");
  sablony = ulozene ? JSON.parse(ulozene) : vychoziSablony();
  if (!Array.isArray(sablony)) sablony = [];
} catch (e) { sablony = vychoziSablony(); }

const ENERGIE = { vysoka: { ikona: "⚡", nazev: "Vysoká" }, stredni: { ikona: "🙂", nazev: "Střední" }, nizka: { ikona: "🌿", nazev: "Nízká" } };
const ENERGIE_PORADI = ["nizka", "stredni", "vysoka"];
const ODHADY = [0, 5, 10, 15, 20, 30, 45, 60, 75, 90, 120, 150, 180, 240, 300, 360, 480];

const HODINA = 48; // výška jedné hodiny v rozvrhu (px)
const PRIORITY = { "Vysoká": "🔴", "Střední": "🟠", "Nízká": "🟢" };
const PRIO_BARVA = { "Vysoká": "#ff3b30", "Střední": "#ff9500", "Nízká": "#34c759" };
const PRIO_PORADI = { "Vysoká": 0, "Střední": 1, "Nízká": 2 };
const MESICE = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];
const DNY = ["Neděle", "Pondělí", "Úterý", "Středa", "Čtvrtek", "Pátek", "Sobota"];
const DNY_KRATKE = ["Ne", "Po", "Út", "St", "Čt", "Pá", "So"];
const OPAKOVANI = { denne: "každý den", tydne: "každý týden", mesicne: "každý měsíc", rocne: "každý rok" };

function uloz() {
  try {
    localStorage.setItem("oblasti", JSON.stringify(oblasti));
    localStorage.setItem("meta", JSON.stringify(meta));
    if (!cloud.blok) {
      localStorage.setItem("zmeneno", new Date().toISOString());
      localStorage.setItem("cloudDirty", "1");
      cloud.verze++;
    }
  } catch (e) {}
  cloudPlanUlozeni();
}
function ulozSablony() { try { localStorage.setItem("sablony", JSON.stringify(sablony)); } catch (e) {} }

function vychoziMeta() {
  return {
    prac: { od: "08:00", do: "17:00" },
    energie: { den: "", uroven: "" },
    mit: {},
    uzavreno: "",
    busy: { url: "", udalosti: [], aktualizace: "" },
    kalendarOutlook: "Úkolníček",
    exportOpt: { odDnes: true, bezHotovych: true }
  };
}

function slucMeta(m) {
  const v = vychoziMeta();
  if (!m || typeof m !== "object") return v;
  if (m.prac && m.prac.od && m.prac.do) v.prac = { od: m.prac.od, do: m.prac.do };
  if (m.energie && typeof m.energie === "object") v.energie = { den: m.energie.den || "", uroven: m.energie.uroven || "" };
  if (m.mit && typeof m.mit === "object") v.mit = m.mit;
  if (typeof m.uzavreno === "string") v.uzavreno = m.uzavreno;
  if (m.busy && Array.isArray(m.busy.udalosti)) v.busy = { url: m.busy.url || "", udalosti: m.busy.udalosti, aktualizace: m.busy.aktualizace || "" };
  if (m.kalendarOutlook) v.kalendarOutlook = String(m.kalendarOutlook);
  if (m.exportOpt && typeof m.exportOpt === "object") v.exportOpt = { odDnes: m.exportOpt.odDnes !== false, bezHotovych: m.exportOpt.bezHotovych !== false };
  return v;
}

// Dvě ukázkové šablony – ukazují, jak postup s návaznostmi funguje
function vychoziSablony() {
  return [
    {
      id: "s-onboarding", nazev: "Onboarding nového kolegy", akce: [
        { text: "Objednat techniku a přístupy", odhad: 30, energie: "nizka", offset: 0, po: -1, popis: "", podukoly: ["Notebook", "E-mail a účty", "Přístupová karta"] },
        { text: "Připravit pracovní místo", odhad: 30, energie: "nizka", offset: 2, po: 0, popis: "", podukoly: [] },
        { text: "První den – uvítání a představení týmu", odhad: 60, energie: "stredni", offset: 3, po: 1, popis: "", podukoly: [] },
        { text: "Plán zaškolení na prvních 30 dní", odhad: 60, energie: "vysoka", offset: 4, po: 2, popis: "", podukoly: [] },
        { text: "Zpětná vazba po 30 dnech", odhad: 45, energie: "stredni", offset: 33, po: 3, popis: "", podukoly: [] }
      ]
    },
    {
      id: "s-uzaverka", nazev: "Měsíční uzávěrka", akce: [
        { text: "Zkontrolovat otevřené faktury", odhad: 60, energie: "stredni", offset: 0, po: -1, popis: "", podukoly: [] },
        { text: "Odsouhlasit bankovní výpisy", odhad: 60, energie: "stredni", offset: 1, po: 0, popis: "", podukoly: [] },
        { text: "Zaúčtovat rezervy a časové rozlišení", odhad: 90, energie: "vysoka", offset: 2, po: 1, popis: "", podukoly: [] },
        { text: "Připravit reporting pro vedení", odhad: 120, energie: "vysoka", offset: 3, po: 2, popis: "", podukoly: [] },
        { text: "Odeslat a archivovat podklady", odhad: 30, energie: "nizka", offset: 4, po: 3, popis: "", podukoly: [] }
      ]
    }
  ];
}

function nid() {
  nidCislo++;
  return "i" + Date.now().toString(36) + nidCislo.toString(36) + Math.random().toString(36).slice(2, 6);
}

// Doplní chybějící pole u starších dat, zajistí id a složku Inbox
function normalizuj() {
  const videna = {};
  oblasti.forEach(function (o) {
    if (!o.projekty) o.projekty = [];
    if (!o.barva) o.barva = "#007aff";
    o.cil = Number(o.cil) > 0 ? Number(o.cil) : 0;
    o.pracovni = !!o.pracovni;
    o.inbox = !!o.inbox;
    o.projekty.forEach(function (p) {
      if (!p.ukoly) p.ukoly = [];
      if (!p.priorita) p.priorita = "Střední";
      if (p.termin === undefined) p.termin = "";
      if (!p.id) p.id = nid();
      p.ukoly.forEach(function (u) {
        if (u.termin === undefined) u.termin = "";
        if (u.zacatek === undefined) u.zacatek = "";
        if (u.konec === undefined) u.konec = "";
        if (u.popis === undefined) u.popis = "";
        if (!u.opak) u.opak = { typ: "", do: "" };
        if (!u.hotoveDny) u.hotoveDny = [];
        if (!u.podukoly) u.podukoly = [];
        u.hotovo = !!u.hotovo;
        u.odhad = Number(u.odhad) > 0 ? Number(u.odhad) : 0;
        if (!ENERGIE[u.energie]) u.energie = "";
        if (!u.ceka || typeof u.ceka !== "object") u.ceka = null;
        if (!u.po) u.po = "";
        if (!u.id || videna[u.id]) u.id = nid();
        videna[u.id] = true;
      });
    });
  });
  let ib = oblasti.find(function (o) { return o.inbox; });
  if (!ib) {
    ib = { nazev: "📥 Inbox", barva: "#8e8e93", cil: 0, pracovni: false, inbox: true, projekty: [] };
    oblasti.unshift(ib);
  }
  oblasti.forEach(function (o) { if (o !== ib) o.inbox = false; });
  if (oblasti[0] !== ib) { oblasti.splice(oblasti.indexOf(ib), 1); oblasti.unshift(ib); }
  if (!ib.projekty.length) ib.projekty.push({ id: nid(), nazev: "Inbox", priorita: "Střední", termin: "", ukoly: [] });
  Object.keys(meta.mit).forEach(function (k) { if (k < pridejDny(dnesKlic(), -21)) delete meta.mit[k]; });
}

/* =====================  POMOCNÉ FUNKCE  ===================== */
function el(tag, text, styl, trida) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  if (styl) e.style.cssText = styl;
  if (trida) e.className = trida;
  return e;
}

function pad(n) { return (n < 10 ? "0" : "") + n; }
function klic(r, m, d) { return r + "-" + pad(m + 1) + "-" + pad(d); }
function parseKlic(k) { const c = k.split("-"); return new Date(Number(c[0]), Number(c[1]) - 1, Number(c[2])); }
function klicZDate(d) { return klic(d.getFullYear(), d.getMonth(), d.getDate()); }
function dnesKlic() { return klicZDate(new Date()); }
function pridejDny(k, n) { const d = parseKlic(k); d.setDate(d.getDate() + n); return klicZDate(d); }
function rozdilDnu(a, b) {
  const da = parseKlic(a), db = parseKlic(b);
  return Math.round((Date.UTC(db.getFullYear(), db.getMonth(), db.getDate()) - Date.UTC(da.getFullYear(), da.getMonth(), da.getDate())) / 86400000);
}
function pridejMesice(k, n) {
  const d = parseKlic(k);
  const den = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const posledni = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(den, posledni));
  return klicZDate(d);
}
function pondeliTydne(k) {
  const d = parseKlic(k);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return klicZDate(d);
}
function nyniKlic() {
  const t = new Date();
  return klicZDate(t) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes());
}
function minuty(c) { const x = c.split(":"); return Number(x[0]) * 60 + Number(x[1]); }
function cas(min) { return pad(Math.floor(min / 60)) + ":" + pad(min % 60); }

function textBarva(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 160 ? "#000" : "#fff";
}

function datumCz(t) {
  const c = t.split("-");
  return Number(c[2]) + ". " + Number(c[1]) + ". " + c[0];
}
function denNazev(k) { return DNY[parseKlic(k).getDay()] + " " + datumCz(k); }
function casText(u) { return u.zacatek ? u.zacatek + (u.konec ? "–" + u.konec : "") : ""; }
function normText(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

function casVyber(hodnota) {
  const s = el("select", "", "", "mini");
  const prazdny = el("option", "—");
  prazdny.value = "";
  s.appendChild(prazdny);
  const moznosti = [];
  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m += 15) moznosti.push(pad(h) + ":" + pad(m));
  }
  if (hodnota && moznosti.indexOf(hodnota) === -1) {
    moznosti.push(hodnota);
    moznosti.sort();
  }
  moznosti.forEach(function (c) {
    const op = el("option", c);
    op.value = c;
    s.appendChild(op);
  });
  s.value = hodnota || "";
  return s;
}

function vyberPriority(hodnota) {
  const s = el("select", "", "", "mini");
  Object.keys(PRIORITY).forEach(function (p) {
    const op = el("option", PRIORITY[p] + " " + p);
    op.value = p;
    s.appendChild(op);
  });
  s.value = hodnota;
  return s;
}

function ikona(znak, akce) {
  const b = el("button", znak, "", "ikona");
  b.onclick = function (e) { e.stopPropagation(); akce(); };
  return b;
}

function kolecko(hotovo, zmena) {
  const b = el("button", hotovo ? "✓" : "", "", "kolecko" + (hotovo ? " hotovo" : ""));
  b.onclick = function (e) { e.stopPropagation(); zmena(); };
  return b;
}

/* =====================  OPAKOVÁNÍ A STAV „HOTOVO“  ===================== */
function jeOpak(u) { return !!(u.opak && u.opak.typ); }

// Vyskytuje se akce v daný den? (řeší i opakující se akce)
function vyskytujeSe(u, den) {
  if (!u.termin) return false;
  if (!jeOpak(u)) return u.termin === den;
  if (den < u.termin) return false;
  if (u.opak.do && den > u.opak.do) return false;
  if (u.opak.typ === "denne") return true;
  if (u.opak.typ === "tydne") return rozdilDnu(u.termin, den) % 7 === 0;
  const a = parseKlic(u.termin), b = parseKlic(den);
  const mesicu = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (u.opak.typ === "mesicne") return pridejMesice(u.termin, mesicu) === den;
  if (u.opak.typ === "rocne") return mesicu % 12 === 0 && pridejMesice(u.termin, mesicu) === den;
  return false;
}

function dalsiVyskyt(u, od) {
  if (od < u.termin) od = u.termin;
  for (let n = 0; n <= 800; n++) {
    const k = pridejDny(od, n);
    if (u.opak.do && k > u.opak.do) return "";
    if (vyskytujeSe(u, k)) return k;
  }
  return "";
}

// Den, který se u akce zobrazuje (u opakující se akce nejbližší další výskyt)
function zobrazenyDen(u) {
  if (!jeOpak(u)) return u.termin || "";
  return dalsiVyskyt(u, dnesKlic()) || u.termin;
}

function jeHotovo(u, den) { return jeOpak(u) ? u.hotoveDny.indexOf(den) !== -1 : !!u.hotovo; }

function prepniHotovo(u, den) {
  if (jeOpak(u)) {
    const i = u.hotoveDny.indexOf(den);
    if (i === -1) u.hotoveDny.push(den); else u.hotoveDny.splice(i, 1);
  } else {
    u.hotovo = !u.hotovo;
    if (u.hotovo) {
      const odemceno = [];
      oblasti.forEach(function (o) {
        o.projekty.forEach(function (p) {
          p.ukoly.forEach(function (b) {
            if (b.po === u.id && !b.hotovo && !jeZablokovana(b)) odemceno.push(b.text);
          });
        });
      });
      if (odemceno.length) toast("🔓 Odemčeno: " + odemceno.join(", "), false);
    }
  }
}

function opakPopis(u) {
  return OPAKOVANI[u.opak.typ] + (u.opak.do ? " do " + datumCz(u.opak.do) : "");
}

/* =====================  DATA PRO ZOBRAZENÍ  ===================== */
// Postup projektu se počítá z jednorázových akcí (opakující se nikdy nekončí)
function postup(p) {
  const j = p.ukoly.filter(function (u) { return !jeOpak(u); });
  const h = j.filter(function (u) { return u.hotovo; }).length;
  return { n: j.length, h: h, proc: j.length ? Math.round(h / j.length * 100) : 0, opak: p.ukoly.length - j.length };
}

function razeniDne(a, b) {
  function k(x) { return x.typ === "projekt" ? "z" : (x.u.zacatek || "y"); }
  if (k(a) === k(b)) return 0;
  return k(a) < k(b) ? -1 : 1;
}

// Všechny akce (včetně výskytů opakujících se) a termíny projektů v daný den
function polozkyNaDen(den, bezFiltru) {
  const v = [];
  oblasti.forEach(function (o, i) {
    o.projekty.forEach(function (p, j) {
      if (!bezFiltru && filtrPriorita && p.priorita !== filtrPriorita) return;
      p.ukoly.forEach(function (u) {
        if (vyskytujeSe(u, den) && !jeZablokovana(u)) v.push({ typ: "akce", u: u, p: p, o: o, i: i, j: j, den: den });
      });
      if (p.termin === den) v.push({ typ: "projekt", p: p, o: o, i: i, j: j, den: den });
    });
  });
  return v.sort(razeniDne);
}

function akceBezTerminu() {
  const v = [];
  oblasti.forEach(function (o, i) {
    o.projekty.forEach(function (p, j) {
      if (filtrPriorita && p.priorita !== filtrPriorita) return;
      p.ukoly.forEach(function (u) {
        if (!u.termin && !jeZablokovana(u)) v.push({ typ: "akce", u: u, p: p, o: o, i: i, j: j, den: "" });
      });
    });
  });
  return v;
}

function serazeneProjekty(o) {
  return o.projekty
    .map(function (p, j) { return { p: p, j: j }; })
    .filter(function (x) { return !filtrPriorita || x.p.priorita === filtrPriorita; })
    .sort(function (a, b) {
      const ta = a.p.termin || "9999";
      const tb = b.p.termin || "9999";
      if (ta !== tb) return ta < tb ? -1 : 1;
      return (PRIO_PORADI[a.p.priorita] || 0) - (PRIO_PORADI[b.p.priorita] || 0);
    });
}

function serazeneAkce(p) {
  function klicAkce(u) {
    const d = zobrazenyDen(u);
    return d ? d + " " + (u.zacatek || "00:00") : "9999";
  }
  return p.ukoly.slice().sort(function (a, b) {
    const ka = klicAkce(a), kb = klicAkce(b);
    if (ka === kb) return 0;
    return ka < kb ? -1 : 1;
  });
}

function vsechnyProjekty() {
  const v = [];
  oblasti.forEach(function (o) { o.projekty.forEach(function (p) { v.push({ o: o, p: p }); }); });
  return v;
}

function hledej(q) {
  const hledany = normText(q).trim();
  const v = [];
  if (!hledany) return v;
  oblasti.forEach(function (o, i) {
    o.projekty.forEach(function (p, j) {
      p.ukoly.forEach(function (u) {
        const text = normText(u.text + " " + u.popis + " " + u.podukoly.map(function (s) { return s.text; }).join(" ") + " " + p.nazev + " " + o.nazev);
        if (text.indexOf(hledany) !== -1) v.push({ typ: "akce", u: u, p: p, o: o, i: i, j: j, den: zobrazenyDen(u) });
      });
    });
  });
  v.sort(function (a, b) {
    const ka = a.den || "9999", kb = b.den || "9999";
    if (ka === kb) return 0;
    return ka < kb ? -1 : 1;
  });
  return v;
}

/* =====================  KONTROLA LOGIKY ČASU  ===================== */
// Akce, které se časově překrývají s danou akcí v daný den (napříč všemi oblastmi).
// Akce bez konce se počítá jako 15 minut. Hotové akce se nepočítají.
function prekryvy(u, vynech, den) {
  const vysl = [];
  den = den || u.termin;
  if (!den || !u.zacatek || jeHotovo(u, den)) return vysl;
  const s1 = minuty(u.zacatek);
  const e1 = u.konec ? minuty(u.konec) : s1 + (u.odhad || 15);
  polozkyNaDen(den, true).forEach(function (x) {
    if (x.typ !== "akce" || x.u === vynech || x.u === u || !x.u.zacatek || jeHotovo(x.u, den)) return;
    const s2 = minuty(x.u.zacatek);
    const e2 = x.u.konec ? minuty(x.u.konec) : s2 + (x.u.odhad || 15);
    if (s1 < e2 && s2 < e1) {
      vysl.push(x.u.text + " (" + x.o.nazev + " › " + x.p.nazev + ", " + casText(x.u) + ")");
    }
  });
  return vysl;
}

function chyby(d) {
  const e = [];
  if (d.konec && !d.zacatek) e.push("Je zadán konec, ale chybí začátek.");
  if ((d.zacatek || d.konec) && !d.termin) e.push("Čas je zadán bez data. Vyber i datum.");
  if (d.zacatek && d.konec && d.konec <= d.zacatek) {
    e.push("Konec (" + d.konec + ") musí být později než začátek (" + d.zacatek + ").");
  }
  if (jeOpak(d) && !d.termin) e.push("Opakování potřebuje datum prvního výskytu.");
  if (jeOpak(d) && d.opak.do && d.termin && d.opak.do < d.termin) e.push("Konec opakování je dřív než první termín.");
  return e;
}

function varovani(d, vynech, o) {
  const w = [];
  if (d.termin && !jeOpak(d) && !d.hotovo) {
    const k = d.termin + " " + (d.konec || d.zacatek || "23:59");
    if (k < nyniKlic()) w.push("Termín akce už uplynul.");
  }
  prekryvy(d, vynech).forEach(function (t) { w.push("Překrývá se s: " + t); });
  if (d.termin && d.zacatek && !d.hotovo) {
    const s = minuty(d.zacatek), e = d.konec ? minuty(d.konec) : s + (d.odhad || 15);
    busyNaDen(d.termin).forEach(function (b) {
      if (s < b.do && b.od < e) w.push("Kolize s Outlookem (obsazeno " + cas(b.od) + "–" + cas(Math.min(b.do, 1439)) + ").");
    });
  }
  if (d.termin && !d.hotovo && !d.ceka && trvani(d) > 0) {
    const celkem = planDne(d.termin, vynech) + trvani(d);
    const volno = volnoDne(d.termin);
    if (celkem > volno) {
      w.push("Na " + datumCz(d.termin) + " bude naplánováno " + fmtMin(celkem) +", ale volno je jen " + fmtMin(volno) + ".");
    }
  }
  if (o && o.pracovni && d.termin && !d.hotovo) {
    const den = parseKlic(d.termin).getDay();
    if (den === 0 || den === 6) w.push("Pracovní akce je naplánovaná na víkend.");
    else if (d.zacatek) {
      const ok = oknoPrace();
      const konec = d.konec ? minuty(d.konec) : minuty(d.zacatek);
      if (minuty(d.zacatek) < ok[0] || konec > ok[1]) w.push("Pracovní akce je mimo pracovní dobu (" + meta.prac.od + "–" + meta.prac.do + ").");
    }
  }
  return w;
}

function souhlasTermin(p, datum) {
  if (!datum || !p.termin || datum <= p.termin) return true;
  const ok = confirm(
    "Termín akce (" + datumCz(datum) + ") je později než termín projektu (" + datumCz(p.termin) + ").\n\n" +
    "Posunout termín projektu na " + datumCz(datum) + "?"
  );
  if (ok) p.termin = datum;
  return ok;
}

function potvrdAkci(d, p, vynech) {
  const e = chyby(d);
  if (e.length) {
    alert("Čas akce není v pořádku:\n\n• " + e.join("\n• "));
    return false;
  }
  const w = varovani(d, vynech, oblastProjektu(p));
  if (w.length && !confirm("Pozor:\n\n• " + w.join("\n• ") + "\n\nUložit i přesto?")) return false;
  return souhlasTermin(p, d.termin);
}

function souhlasProjekt(p, termin) {
  if (!termin) return true;
  const w = [];
  if (termin < dnesKlic()) w.push("Termín projektu je v minulosti.");
  let nejpozdeji = "";
  p.ukoly.forEach(function (u) {
    if (!jeOpak(u) && !u.hotovo && u.termin && u.termin > nejpozdeji) nejpozdeji = u.termin;
  });
  if (nejpozdeji && nejpozdeji > termin) {
    w.push("Projekt obsahuje nedokončenou akci s termínem " + datumCz(nejpozdeji) + ", tedy po tomto termínu projektu.");
  }
  return w.length === 0 || confirm("Pozor:\n\n• " + w.join("\n• ") + "\n\nNastavit i přesto?");
}

/* =====================  INBOX, ODHADY, KAPACITA, ZÁVISLOSTI  ===================== */
function inboxOblast() { return oblasti.find(function (o) { return o.inbox; }); }
function inboxProjekt() { return inboxOblast().projekty[0]; }
function jeInbox(p) { return p === inboxProjekt(); }
function bezInboxu() { return oblasti.filter(function (o) { return !o.inbox; }); }
function oblastProjektu(p) { return oblasti.find(function (o) { return o.projekty.indexOf(p) !== -1; }); }
function datumKratce(k) { const c = k.split("-"); return Number(c[2]) + ". " + Number(c[1]) + "."; }

function najdiAkci(id) {
  if (!id) return null;
  for (let i = 0; i < oblasti.length; i++) {
    for (let j = 0; j < oblasti[i].projekty.length; j++) {
      const uk = oblasti[i].projekty[j].ukoly;
      for (let k = 0; k < uk.length; k++) {
        if (uk[k].id === id) return { u: uk[k], p: oblasti[i].projekty[j], o: oblasti[i], i: i, j: j };
      }
    }
  }
  return null;
}

// Akce je zablokovaná, dokud není hotová akce, na které závisí
function jeZablokovana(u) {
  if (!u.po) return false;
  const a = najdiAkci(u.po);
  return !!(a && a.u.id !== u.id && !a.u.hotovo);
}

function zavisiNa(u, cilId) {
  const videno = {};
  let a = u;
  while (a && a.po && !videno[a.po]) {
    if (a.po === cilId) return true;
    videno[a.po] = true;
    const n = najdiAkci(a.po);
    a = n ? n.u : null;
  }
  return false;
}

function fmtMin(m) {
  m = Math.round(m);
  if (m <= 0) return "0 min";
  const h = Math.floor(m / 60), z = m % 60;
  if (!h) return z + " min";
  return h + " h" + (z ? " " + z + " min" : "");
}

function fmtHod(min) { return (Math.round(min / 6) / 10).toString().replace(".", ","); }

// Délka akce: z časového okna, jinak z odhadu
function trvani(u) {
  if (u.zacatek && u.konec) return Math.max(0, minuty(u.konec) - minuty(u.zacatek));
  return Number(u.odhad) || 0;
}

function znacky(u) {
  const z = [];
  if (u.odhad) z.push("⏱ " + fmtMin(u.odhad));
  if (u.energie && ENERGIE[u.energie]) z.push(ENERGIE[u.energie].ikona);
  if (u.ceka) z.push("⏳ " + (u.ceka.kdo || "čekám") + (u.ceka.od ? " od " + datumKratce(u.ceka.od) : ""));
  if (jeZablokovana(u)) {
    const a = najdiAkci(u.po);
    z.push("🔒 až po: " + (a ? a.u.text : "?"));
  }
  return z;
}

function maly(text, akce) {
  const b = el("button", text, "", "maly-btn");
  b.onclick = function (e) { e.stopPropagation(); akce(); };
  return b;
}

/* --- pracovní okno, Outlook obsazenost, kapacita --- */
function oknoPrace() { return [minuty(meta.prac.od), minuty(meta.prac.do)]; }

function busyNaDen(den) {
  return (meta.busy.udalosti || []).filter(function (b) { return b.den === den; });
}

function sluc(intervaly) {
  const s = intervaly.slice().sort(function (a, b) { return a[0] - b[0]; });
  const v = [];
  s.forEach(function (i) {
    const l = v[v.length - 1];
    if (l && i[0] <= l[1]) l[1] = Math.max(l[1], i[1]); else v.push([i[0], i[1]]);
  });
  return v;
}

function volnoDne(den) {
  const okno = oknoPrace();
  const busy = sluc(busyNaDen(den).map(function (b) {
    return [Math.max(b.od, okno[0]), Math.min(b.do, okno[1])];
  }).filter(function (i) { return i[1] > i[0]; }));
  let obs = 0;
  busy.forEach(function (i) { obs += i[1] - i[0]; });
  return Math.max(0, okno[1] - okno[0] - obs);
}

// Akce, které je ten den potřeba udělat (bez hotových, čekajících a zablokovaných)
function akceDne(den) {
  return polozkyNaDen(den, true).filter(function (x) {
    return x.typ === "akce" && !jeHotovo(x.u, den) && !x.u.ceka;
  });
}

function planDne(den, vynech) {
  let s = 0;
  akceDne(den).forEach(function (x) { if (x.u !== vynech) s += trvani(x.u); });
  return s;
}

// První volné místo v pracovní době (násobky 15 min), -1 když se nevejde
function volnyCas(den, delka, odMin) {
  const okno = oknoPrace();
  let t = Math.ceil(Math.max(okno[0], odMin || 0) / 15) * 15;
  const obs = [];
  akceDne(den).forEach(function (x) {
    if (!x.u.zacatek) return;
    const s = minuty(x.u.zacatek);
    obs.push([s, x.u.konec ? minuty(x.u.konec) : s + (x.u.odhad || 15)]);
  });
  busyNaDen(den).forEach(function (b) { obs.push([b.od, b.do]); });
  const m = sluc(obs);
  for (let i = 0; i < m.length; i++) {
    if (m[i][1] <= t) continue;
    if (m[i][0] >= t + delka) break;
    t = Math.ceil(m[i][1] / 15) * 15;
  }
  return t + delka <= okno[1] ? t : -1;
}

/* --- energie a tři nejdůležitější --- */
function aktualniEnergie() { return meta.energie.den === dnesKlic() ? meta.energie.uroven : ""; }

function energieSedi(u) {
  const e = aktualniEnergie();
  if (!e || !u.energie) return true;
  return ENERGIE_PORADI.indexOf(u.energie) <= ENERGIE_PORADI.indexOf(e);
}

function mitDne(den) {
  return (meta.mit[den] || []).filter(function (id) { return !!najdiAkci(id); }).slice(0, 3);
}
function jeMit(id, den) { return mitDne(den).indexOf(id) !== -1; }

function prepniMit(u, den) {
  const arr = mitDne(den);
  const i = arr.indexOf(u.id);
  if (i !== -1) arr.splice(i, 1);
  else {
    if (arr.length >= 3) { alert("Na jeden den máš už 3 nejdůležitější věci. Nejdřív jednu odeber."); return; }
    arr.push(u.id);
  }
  meta.mit[den] = arr;
  uloz();
  vykresli();
}

function porovnejKandidaty(a, b) {
  const ta = a.u.termin || "9999", tb = b.u.termin || "9999";
  if (ta !== tb) return ta < tb ? -1 : 1;
  const pa = PRIO_PORADI[a.p.priorita] || 0, pb = PRIO_PORADI[b.p.priorita] || 0;
  if (pa !== pb) return pa - pb;
  const e = aktualniEnergie();
  const sa = e && a.u.energie === e ? 0 : 1, sb = e && b.u.energie === e ? 0 : 1;
  return sa - sb;
}

// Co lze na daný den naplánovat: bez termínu nebo po termínu nebo dnešní bez času
function kandidatiPlanu(den, vse) {
  const v = [];
  oblasti.forEach(function (o, i) {
    o.projekty.forEach(function (p, j) {
      p.ukoly.forEach(function (u) {
        if (u.ceka || jeZablokovana(u)) return;
        if (jeOpak(u)) {
          if (vse && vyskytujeSe(u, den) && !jeHotovo(u, den)) v.push({ typ: "akce", u: u, p: p, o: o, i: i, j: j, den: den });
          return;
        }
        if (u.hotovo) return;
        if (u.termin && u.termin > den) return;
        if (!vse && u.termin === den && u.zacatek) return;
        if (!vse && !energieSedi(u)) return;
        v.push({ typ: "akce", u: u, p: p, o: o, i: i, j: j, den: u.termin || "" });
      });
    });
  });
  return v.sort(porovnejKandidaty);
}

function otevriVyber(titul, polozky, pri) {
  const s = document.getElementById("sheet");
  s.innerHTML = "";
  s.className = "otevreno";
  s.onclick = function (e) { if (e.target === s) zavriVyber(); };
  const panel = el("div", "", "", "sheet-panel");
  const hl = el("div", "", "", "sheet-hl");
  const z = el("button", "Zavřít", "", "btn");
  z.onclick = zavriVyber;
  hl.append(z, el("div", titul, "font-weight:700"), el("span", "", "width:60px"));
  panel.appendChild(hl);
  const tel = el("div", "", "", "sheet-tel");
  const karta = el("div", "", "", "karta");
  if (!polozky.length) karta.appendChild(el("div", "Není z čeho vybírat.", "padding:14px;color:var(--sedy2)"));
  polozky.forEach(function (x) {

/* =====================  RYCHLÝ ZÁPIS (CHYTRÉ ZADÁNÍ)  ===================== */
const DNY_SLOVA = { pondeli: 1, utery: 2, streda: 3, stredu: 3, ctvrtek: 4, ctvrtku: 4, patek: 5, patku: 5, sobota: 6, sobotu: 6, nedele: 0, nedeli: 0 };

function najdiCil(tag) {
  if (!tag) return null;
  const norm = function (t) { return normText(t).replace(/[^a-z0-9]/g, ""); };
  const casti = tag.split("/");
  const t1 = norm(casti[0]), t2 = casti[1] ? norm(casti[1]) : "";
  if (!t1) return null;
  function shoda(seznam, t) {
    return seznam.find(function (x) { return norm(x.nazev) === t; }) ||
      seznam.find(function (x) { return norm(x.nazev).indexOf(t) === 0; }) || null;
  }
  const poli = bezInboxu();
  const o = shoda(poli, t1);
  if (o) {
    if (!t2) return { o: o, p: o.projekty.length ? o.projekty[0] : null };
    const p = shoda(o.projekty, t2);
    return p ? { o: o, p: p } : null;
  }
  let nalez = null;
  poli.forEach(function (ob) {
    if (nalez) return;
    const p = shoda(ob.projekty, t1);
    if (p) nalez = { o: ob, p: p };
  });
  return nalez;
}

function parsujZapis(vstup) {
  const orig = String(vstup || "").normalize("NFC");
  let s = normText(orig);
  if (s.length !== orig.length) s = orig.toLowerCase();
  let o2 = orig;
  const r = { text: "", termin: "", zacatek: "", konec: "", odhad: 0, energie: "", cil: null, cekaKdo: "", pripomenout: "", tag: "" };
  const dnes = dnesKlic();

  function vyrez(re) {
    const m = re.exec(s);
    if (!m) return null;
    const mezery = new Array(m[0].length + 1).join(" ");
    s = s.slice(0, m.index) + mezery + s.slice(m.index + m[0].length);
    o2 = o2.slice(0, m.index) + mezery + o2.slice(m.index + m[0].length);
    return m;
  }
  function hm(h, m) {
    h = Number(h); m = Number(m);
    return h < 24 && m < 60 ? pad(h) + ":" + pad(m) : "";
  }

  let m = vyrez(/#([a-z0-9_\/\-]+)/);
  if (m) r.tag = m[1];
  m = vyrez(/@(vysok|stredn|nizk)\w*/);
  if (m) r.energie = { vysok: "vysoka", stredn: "stredni", nizk: "nizka" }[m[1]];

  m = vyrez(/\b(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})\b/);
  if (m) { r.zacatek = hm(m[1], m[2]); r.konec = hm(m[3], m[4]); }
  else {
    m = vyrez(/\b(\d{1,2}):(\d{2})\b/);
    if (m) r.zacatek = hm(m[1], m[2]);
    else {
      m = vyrez(/\bve?\s+(\d{1,2})(?:\s?(?:hodin\w*|hod|h))?\b(?!\s?(?:min|dn|tyd|kus))/);
      if (m) r.zacatek = hm(m[1], 0);
    }
  }

  m = vyrez(/\b(\d+(?:[.,]\d+)?)\s?(hodin\w*|hod|h|minut\w*|min|m)\b/);
  if (m) {
    const cislo = parseFloat(m[1].replace(",", "."));
    const min = Math.round(m[2].charAt(0) === "h" ? cislo * 60 : cislo);
    if (min > 0 && min <= 1440) r.odhad = min;
  }

  if ((m = vyrez(/\b(\d{4})-(\d{2})-(\d{2})\b/))) {
    r.termin = m[1] + "-" + m[2] + "-" + m[3];
  } else if ((m = vyrez(/\b(\d{1,2})\.\s?(\d{1,2})\.(?:\s?(\d{4}))?/))) {
    const den = Number(m[1]), mes = Number(m[2]);
    let rok = m[3] ? Number(m[3]) : parseKlic(dnes).getFullYear();
    const test = new Date(rok, mes - 1, den);
    if (test.getMonth() === mes - 1 && test.getDate() === den) {
      let k = klic(rok, mes - 1, den);
      if (!m[3] && k < dnes) k = klic(rok + 1, mes - 1, den);
      r.termin = k;
    }
  } else if (vyrez(/\bpozitri\b/)) {
    r.termin = pridejDny(dnes, 2);
  } else if (vyrez(/\b(?:zitra|zejtra)\b/)) {
    r.termin = pridejDny(dnes, 1);
  } else if (vyrez(/\bdnes(?:ka)?\b/)) {
    r.termin = dnes;
  } else if ((m = vyrez(/\bza\s+(\d+)\s+(dn\w*|den|tyd\w*)\b/))) {
    r.termin = pridejDny(dnes, Number(m[1]) * (m[2].charAt(0) === "t" ? 7 : 1));
  } else if (vyrez(/\bza\s+tyden\b/)) {
    r.termin = pridejDny(dnes, 7);
  } else if ((m = vyrez(/(?:\b(?:v|ve|na|do)\s+)?(?:\b(pristi)\s+)?\b(pondeli|utery|streda|stredu|ctvrtek|ctvrtku|patek|patku|sobota|sobotu|nedele|nedeli)\b/))) {
    const cilDen = DNY_SLOVA[m[2]];
    const ted = parseKlic(dnes).getDay();
    let rozdil = (cilDen - ted + 7) % 7;
    if (rozdil === 0) rozdil = 7;
    if (m[1] && rozdil <= (7 - ted) % 7) rozdil += 7;
    r.termin = pridejDny(dnes, rozdil);
  }

  if (r.zacatek && !r.termin) r.termin = dnes;
  if (r.zacatek && r.konec && r.konec <= r.zacatek) r.konec = "";
  if (r.zacatek && !r.konec && r.odhad && minuty(r.zacatek) + r.odhad < 1440) r.konec = cas(minuty(r.zacatek) + r.odhad);
  if (!r.zacatek) r.konec = "";

  let text = o2.replace(/\s+/g, " ").trim().replace(/^[,;:\-–]+|[,;:\-–]+$/g, "").trim();
  text = text.replace(/\s+(?:v|ve|do|od|na|dne)$/i, "").trim();
  const kdoMatch = /^[čcČC]ek[áa]m\s+na\s+(.+)$/i.exec(text);
  if (kdoMatch) {
    r.cekaKdo = kdoMatch[1].trim();
    r.pripomenout = r.termin;
    r.termin = ""; r.zacatek = ""; r.konec = "";
    text = "Čekám na " + r.cekaKdo;
  }
  r.text = text ? text.charAt(0).toUpperCase() + text.slice(1) : "";
  r.cil = najdiCil(r.tag);
  return r;
}

function nahledZapisu(r) {
  if (!r.text) return "";
  const c = [];
  if (r.cekaKdo) c.push("⏳ čekám na " + r.cekaKdo);
  if (r.termin) c.push("📅 " + DNY_KRATKE[parseKlic(r.termin).getDay()] + " " + datumCz(r.termin));
  if (r.pripomenout) c.push("🔔 připomenout " + datumCz(r.pripomenout));
  if (r.zacatek) c.push("🕒 " + r.zacatek + (r.konec ? "–" + r.konec : ""));
  if (r.odhad) c.push("⏱ " + fmtMin(r.odhad));
  if (r.energie) c.push(ENERGIE[r.energie].ikona);
  if (r.cil) c.push("→ " + r.cil.o.nazev + (r.cil.p ? " › " + r.cil.p.nazev : " › nový projekt Obecné"));
  else c.push("→ Inbox" + (r.tag ? " (štítek #" + r.tag + " jsem nenašel)" : ""));
  return c.join(" · ");
}

function rychlyZapis() {
  const inp = document.getElementById("rychly");
  const r = parsujZapis(inp.value);
  if (!r.text) return;
  let o, p;
  if (r.cil) {
    o = r.cil.o;
    p = r.cil.p || { id: nid(), nazev: "Obecné", priorita: "Střední", termin: "", ukoly: [] };
  } else {
    o = inboxOblast();
    p = inboxProjekt();
  }
  const u = novaAkceData();
  u.text = r.text; u.termin = r.termin; u.zacatek = r.zacatek; u.konec = r.konec;
  u.odhad = r.odhad; u.energie = r.energie;
  if (r.cekaKdo) u.ceka = { kdo: r.cekaKdo, od: dnesKlic(), pripomenout: r.pripomenout };
  if (u.termin && !jeInbox(p) && !souhlasTermin(p, u.termin)) return;
  const novyProjekt = o.projekty.indexOf(p) === -1;
  if (novyProjekt) o.projekty.push(p);
  p.ukoly.push(u);
  undoZasobnik.push({
    popis: "Přidání „" + u.text + "“",
    vrat: function () {
      const i = p.ukoly.indexOf(u);
      if (i !== -1) p.ukoly.splice(i, 1);
      if (novyProjekt) { const j = o.projekty.indexOf(p); if (j !== -1) o.projekty.splice(j, 1); }
    }
  });
  inp.value = "";
  document.getElementById("rychlyNahled").textContent = "";
  uloz();
  vykresli();
  toast("Přidáno → " + (o.inbox ? "Inbox" : o.nazev + " › " + p.nazev), true);
}

/* =====================  ŠABLONY PROJEKTŮ  ===================== */
function ulozJakoSablonu(p) {
  const nazev = prompt("Název šablony:", p.nazev);
  if (!nazev || !nazev.trim()) return;
  const seznam = p.ukoly.filter(function (u) { return !jeOpak(u); });
  const dny = seznam.filter(function (u) { return u.termin; }).map(function (u) { return u.termin; }).sort();
  const zaklad = dny[0] || "";
  sablony.push({
    id: nid(),
    nazev: nazev.trim(),
    akce: seznam.map(function (u) {
      return {
        text: u.text, popis: u.popis, odhad: u.odhad, energie: u.energie,
        offset: u.termin && zaklad ? rozdilDnu(zaklad, u.termin) : null,
        po: u.po ? seznam.findIndex(function (x) { return x.id === u.po; }) : -1,
        podukoly: u.podukoly.map(function (s) { return s.text; })
      };
    })
  });
  ulozSablony();
  toast("Šablona „" + nazev.trim() + "“ uložena", false);
}

function vytvorZeSablony(s, o, nazev, start) {
  const idy = s.akce.map(function () { return nid(); });
  const p = { id: nid(), nazev: nazev, priorita: "Střední", termin: "", ukoly: [] };
  let nejpozdeji = "";
  s.akce.forEach(function (a, k) {
    const u = novaAkceData();
    u.id = idy[k];
    u.text = a.text; u.popis = a.popis || ""; u.odhad = a.odhad || 0; u.energie = a.energie || "";
    u.podukoly = (a.podukoly || []).map(function (t) { return { text: t, hotovo: false }; });
    if (a.offset !== null && a.offset !== undefined && start) {
      u.termin = pridejDny(start, a.offset);
      if (u.termin > nejpozdeji) nejpozdeji = u.termin;
    }
    u.po = a.po >= 0 && idy[a.po] ? idy[a.po] : "";
    p.ukoly.push(u);
  });
  p.termin = nejpozdeji;
  o.projekty.push(p);
  return p;
}

function formularSablona(o) {

/* =====================  ZPĚT (UNDO) A OZNÁMENÍ  ===================== */
function toast(text, sZpet) {
  const t = document.getElementById("toast");
  t.innerHTML = "";
  t.appendChild(el("span", text));
  if (sZpet) {
    const b = el("button", "Zpět", "background:none;border:none;color:#0a84ff;font-size:16px;font-weight:600;padding:0");
    b.onclick = function () { undo(); };
    t.appendChild(b);
  }
  t.style.display = "flex";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = "none"; }, 6000);
}

// Smaže prvek z pole a umožní vrácení zpět
function smazPrvek(popis, pole, prvek) {
  const index = pole.indexOf(prvek);
  if (index === -1) return;
  pole.splice(index, 1);
  undoZasobnik.push({
    popis: popis,
    vrat: function () { pole.splice(Math.min(index, pole.length), 0, prvek); }
  });
  if (undoZasobnik.length > 30) undoZasobnik.shift();
  uloz();
  vykresli();
  toast(popis + " – smazáno", true);
}

function undo() {
  const s = undoZasobnik.pop();
  if (!s) return;
  s.vrat();
  uloz();
  vykresli();
  toast("Vráceno: " + s.popis, false);
}

  }
  obal.appendChild(karta);
  if (otevrena && !uzavreno) obal.appendChild(kartaMit(zitra));
  return obal;
}

function posunTermin(x, novy) {
  if (!souhlasTermin(x.p, novy)) return;
  x.u.termin = novy;
  uloz();
  vykresli();
}

function vykresliPrehled() {
  const box = document.getElementById("prehled");
  box.innerHTML = "";
  const dnes = dnesKlic();
  const nyni = nyniKlic();
  const konecTydne = pridejDny(pondeliTydne(dnes), 6);

  // Po termínu: jednorázové akce a projekty (opakující se se sem nepočítají)
  const po = [];
  oblasti.forEach(function (o, i) {
    o.projekty.forEach(function (p, j) {
      if (filtrPriorita && p.priorita !== filtrPriorita) return;
      p.ukoly.forEach(function (u) {
        if (jeOpak(u) || u.hotovo || !u.termin) return;
        if (u.termin + " " + (u.konec || u.zacatek || "23:59") < nyni) {
          po.push({ typ: "akce", u: u, p: p, o: o, i: i, j: j, den: u.termin });
        }
      });
      const pr = postup(p);
      if (p.termin && p.termin < dnes && !(pr.n > 0 && pr.h === pr.n)) {
        po.push({ typ: "projekt", p: p, o: o, i: i, j: j, den: p.termin });
      }
    });
  });
  po.sort(function (a, b) { return a.den < b.den ? -1 : (a.den > b.den ? 1 : 0); });

  const dnesPol = polozkyNaDen(dnes).filter(function (x) {
    return !(x.typ === "akce" && po.some(function (y) { return y.u === x.u; }));
  });
  const tyden = [];
  for (let k = pridejDny(dnes, 1); k <= konecTydne; k = pridejDny(k, 1)) {
    polozkyNaDen(k).forEach(function (x) { tyden.push(x); });
  }

  function sekce(titul, barvaTitulu, polozky, ukazDatum, prazdny, podtitul) {
    const karta = el("div", "", "", "karta");
    karta.appendChild(el("div", titul + (polozky.length ? " · " + polozky.length : ""),
      "padding:14px 14px 8px;font-size:20px;font-weight:700;color:" + barvaTitulu));
    if (podtitul) karta.appendChild(podtitul);
    if (!polozky.length) karta.appendChild(el("div", prazdny, "padding:4px 14px 14px;color:var(--sedy2)"));
    polozky.forEach(function (x) { karta.appendChild(radekPolozky(x, ukazDatum)); });
    box.appendChild(karta);
  }

  // připomenutí: na koho čekám a už je čas se ozvat
  const pripomenout = [];
  oblasti.forEach(function (o, i) {
    o.projekty.forEach(function (p, j) {
      p.ukoly.forEach(function (u) {
        if (u.ceka && !u.hotovo && u.ceka.pripomenout && u.ceka.pripomenout <= dnes) {
          pripomenout.push({ typ: "akce", u: u, p: p, o: o, i: i, j: j, den: u.termin || "" });
        }
      });
    });
  });

  box.appendChild(kartaMit(dnes));
  if (poPraci()) box.appendChild(kartaUzaverka());
  if (pripomenout.length) sekce("⏳ Ozvat se – čekám na", "var(--oranz)", pripomenout, true, "");
  box.appendChild(kartaEnergie(true));
  if (po.length) sekce("Po termínu", "var(--cerv)", po, true, "");

  // kapacita dnešního dne
  const planovano = planDne(dnes), volno = volnoDne(dnes);
  const kap = el("div", planovano > volno ? "⚠️ " + fmtMin(planovano) + " naplánováno, volno jen " + fmtMin(volno) : fmtMin(planovano) + " naplánováno · " + fmtMin(volno) + " volno",
    "padding:0 14px 8px;font-size:14px;color:" + (planovano > volno ? "var(--cerv)" : "var(--sedy)"));
  sekce("Dnes · " + denNazev(dnes), "var(--text)", dnesPol, false, "Na dnešek nic nemáš. 🎉", kap);
  sekce("Tento týden", "var(--text)", tyden, true, "Do neděle je volno.");
  if (!poPraci()) box.appendChild(kartaUzaverka());
}

function vykresliVysledky() {
  const box = document.getElementById("vysledky");
  box.innerHTML = "";
  const v = hledej(dotaz);
  const karta = el("div", "", "", "karta");
  karta.appendChild(el("div", "Hledání „" + dotaz.trim() + "“ · " + v.length, "padding:14px 14px 8px;font-size:18px;font-weight:700"));
  if (!v.length) karta.appendChild(el("div", "Nic nenalezeno.", "padding:4px 14px 14px;color:var(--sedy2)"));
  v.forEach(function (x) { karta.appendChild(radekPolozky(x, true)); });
  box.appendChild(karta);
}

// Řádek položky pro přehled, hledání a kalendář
function radekPolozky(x, ukazDatum) {
  const r = el("div", "", "display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:.5px solid var(--cara2);border-left:6px solid " + x.o.barva);
  const t = el("div", "", "flex:1;min-width:0;cursor:pointer");
  if (x.typ === "projekt") {
    t.appendChild(el("div", "🏁 Termín projektu: " + x.p.nazev));
    t.appendChild(el("div", (ukazDatum ? datumCz(x.den) + " · " : "") + x.o.nazev, "font-size:14px;color:var(--sedy2)"));
    t.onclick = function () { otevri(x.i, x.j); };
    r.appendChild(t);
    return r;
  }
  const u = x.u;
  const hot = jeHotovo(u, x.den);
  const konflikt = prekryvy(u, u, x.den).length > 0 ? " ⚠️" : "";
  t.appendChild(el("div", (x.den && jeMit(u.id, x.den) ? "⭐ " : "") + u.text + (jeOpak(u) ? " 🔁" : "") + konflikt, hot ? "text-decoration:line-through;color:var(--sedy2)" : ""));
  const casti = [];
  if (ukazDatum && x.den) casti.push(datumCz(x.den));
  if (u.zacatek) casti.push(casText(u));
  if (u.podukoly.length) casti.push("☑ " + u.podukoly.filter(function (s) { return s.hotovo; }).length + "/" + u.podukoly.length);
  znacky(u).forEach(function (z) { casti.push(z); });
  casti.push(x.o.inbox ? "Inbox" : x.o.nazev + " › " + x.p.nazev);
  t.appendChild(el("div", casti.join(" · "), "font-size:14px;color:var(--sedy2)"));
  t.onclick = function () { otevriEditor(u, x.p); };
  r.append(kolecko(hot, function () { prepniHotovo(u, x.den); uloz(); vykresli(); }), t);
  return r;
}

// Přepne do seznamu a ukáže daný projekt
function otevri(i, j) {
  otevrena = oblasti[i];
  filtrPriorita = "";
  formProjekt = null;
  prejmenovani = null;
  prepniZalozku("seznam");
  const e = document.getElementById("p-" + i + "-" + j);
  if (e) e.scrollIntoView({ block: "center" });
}

/* =====================  SEZNAM  ===================== */
function vykresliFiltr() {
  const f = document.getElementById("filtr");
  f.innerHTML = "";
  [["", "Vše"], ["Vysoká", "🔴 Vysoká"], ["Střední", "🟠 Střední"], ["Nízká", "🟢 Nízká"]].forEach(function (x) {
    const b = el("button", x[1], "", filtrPriorita === x[0] ? "aktivni" : "");
    b.onclick = function () { filtrPriorita = x[0]; vykresli(); };
    f.appendChild(b);
  });
}

function prepinac(text, hodnota, zmena) {
  const l = el("label", "", "display:flex;align-items:center;gap:10px;font-size:16px");
  const c = el("input");
  c.type = "checkbox";
  c.checked = !!hodnota;
  c.style.cssText = "width:22px;height:22px;margin:0";
  c.onchange = function () { zmena(c.checked); };
  l.append(c, el("span", text));
  return l;
}

function vykresliSeznam() {
  if (oblasti.indexOf(otevrena) === -1) {
    const prvni = oblasti.find(function (o) { return !o.inbox; });
    otevrena = prvni || oblasti[0] || null;
  }
  const box = document.getElementById("oblasti");
  box.innerHTML = "";
  if (oblasti.length === 0) {
    box.appendChild(el("div", "Zatím nemáš žádné oblasti. Přidej první nahoře.", "text-align:center;color:var(--sedy2);padding:30px 0"));
  }
  oblasti.forEach(function (o, i) { box.appendChild(kartaOblasti(o, i)); });
}

function fokusPrejmenovani() {
  const e = document.getElementById("prejm");
  if (e) { e.focus(); e.select(); }
}

// Pole pro přejmenování s tlačítky
function poleNazvu(obj, styl) {
  const inp = el("input", "", styl + ";margin:0;flex:1;min-width:0", "pole");
  inp.id = "prejm";
  inp.value = obj.nazev;
  const ok = function () {
    if (inp.value.trim() === "") return;
    obj.nazev = inp.value.trim();
    prejmenovani = null;
    uloz();
    vykresli();
  };
  inp.onkeydown = function (e) { if (e.key === "Enter") ok(); };
  const bOk = el("button", "OK", "font-weight:700", "btn");
  bOk.onclick = ok;
  const bZpet = el("button", "Zrušit", "", "btn");
  bZpet.onclick = function () { prejmenovani = null; vykresli(); };
  return [inp, bOk, bZpet];
}

function kartaOblasti(o, i) {
  const karta = el("div", "", "", "karta");
  karta.id = "o-" + i;
  const otevr = o === otevrena;

  let vse = 0, hotove = 0;
  o.projekty.forEach(function (p) {
    const pr = postup(p);
    vse += pr.n;
    hotove += pr.h;
  });

  const hl = el("div", "", "background:" + o.barva + ";color:" + textBarva(o.barva), "hlavicka");
  hl.append(
    el("span", otevr ? "▾" : "▸", "font-size:18px;width:14px"),
    el("span", o.nazev, "flex:1;font-size:20px;font-weight:700"),
    el("span", "✓ " + hotove + "/" + vse, "font-size:15px;opacity:.85")
  );
  hl.onclick = function () {
    if (otevrena === o) return;
    otevrena = o;
    formProjekt = null;
    prejmenovani = null;
    vykresli();
    const e = document.getElementById("o-" + i);
    if (e) e.scrollIntoView({ block: "start" });
  };
  karta.appendChild(hl);
  if (!otevr) return karta;

  const telo = el("div", "", "", "telo");
  const seznam = serazeneProjekty(o);
  const sedyText = "color:var(--sedy2);padding:4px 2px 14px";
  if (o.projekty.length === 0) {
    telo.appendChild(el("div", "Zatím žádné projekty.", sedyText));
  } else if (seznam.length === 0) {
    telo.appendChild(el("div", "Žádné projekty s touto prioritou.", sedyText));
  }
  const mrizka = el("div", "", "", "projekty-mrizka");
  seznam.forEach(function (x) { mrizka.appendChild(blokProjektu(o, i, x.p, x.j)); });
  telo.appendChild(mrizka);

  if (o.inbox) {
    telo.appendChild(el("div", "Inbox je pracovní zásobník pro rychlý zápis. Zatřiď ho v záložce Inbox.", "color:var(--sedy2);font-size:14px;padding:0 2px 14px"));
    karta.appendChild(telo);
    return karta;
  }

  const dole = el("div", "", "", "panel");
  if (formProjekt === o) {
    dole.appendChild(formularProjekt(o));
  } else if (formSablona === o) {
    dole.appendChild(formularSablona(o));
  } else {
    const b = el("button", "＋ Přidat projekt", "", "btn");
    b.onclick = function () { formProjekt = o; formSablona = null; vykresli(); };
    const bs = el("button", "📋 Projekt ze šablony", "", "btn");
    bs.onclick = function () { formSablona = o; formProjekt = null; vykresli(); };
    dole.append(b, bs);
  }
  telo.appendChild(dole);

  const pat = el("div", "", "", "panel");
  const r1 = el("div", "", "display:flex;align-items:center;gap:8px");
  if (prejmenovani === o) {
    r1.append.apply(r1, poleNazvu(o, ""));
  } else {
    const b = el("button", "✎ Přejmenovat oblast", "", "btn");
    b.onclick = function () { prejmenovani = o; vykresli(); fokusPrejmenovani(); };
    r1.appendChild(b);
  }
  pat.appendChild(r1);

  const r2 = el("div", "", "display:flex;align-items:center;gap:10px;margin-top:6px");
  r2.appendChild(el("span", "Barva oblasti", "flex:1;color:var(--sedy);font-size:15px"));
  const barva = el("input", "", "", "barva-kolo");
  barva.type = "color";
  barva.value = o.barva;
  barva.onchange = function () { o.barva = barva.value; uloz(); vykresli(); };
  const r3 = el("div", "", "display:flex;align-items:center;gap:10px;margin-top:6px");
  r3.appendChild(el("span", "Cíl hodin týdně", "flex:1;color:var(--sedy);font-size:15px"));
  const cil = el("input", "", "width:90px;margin:0;text-align:right", "mini");
  cil.type = "number";
  cil.min = "0";
  cil.max = "80";
  cil.step = "0.5";
  cil.value = o.cil ? String(o.cil) : "";
  cil.placeholder = "bez cíle";
  cil.onchange = function () { o.cil = Math.max(0, Number(cil.value) || 0); uloz(); vykresli(); };
  r3.append(cil, el("span", "h", "color:var(--sedy)"));
  const r4 = el("div", "", "margin-top:10px");
  r4.appendChild(prepinac("Pracovní oblast (hlídat pracovní dobu a víkendy)", o.pracovni, function (v) { o.pracovni = v; uloz(); }));
  const smazat = el("button", "Smazat oblast", "", "btn btn-cerv");
  smazat.onclick = function () {
    if (!confirm("Smazat oblast „" + o.nazev + "“ včetně všech projektů?")) return;
    if (formProjekt === o) formProjekt = null;
    if (prejmenovani === o) prejmenovani = null;
    smazPrvek("Oblast „" + o.nazev + "“", oblasti, o);
  };
  r2.append(barva, smazat);
  pat.append(r2, r3, r4);
  telo.appendChild(pat);

  karta.appendChild(telo);
  return karta;
}

function formularProjekt(o) {
  const f = el("div");
  const vstup = el("input", "", "", "pole");
  vstup.placeholder = "Název projektu";
  const radek = el("div", "", "display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px");
  const vyber = vyberPriority("Střední");
  const datumP = el("input", "", "", "mini");
  datumP.type = "date";
  radek.append(vyber, el("span", "hotovo do", "color:var(--sedy);font-size:15px"), datumP);

  const pridat = el("button", "Přidat projekt", "", "btn-plny");
  pridat.onclick = function () {
    if (vstup.value.trim() === "") return;
    if (!souhlasProjekt({ ukoly: [] }, datumP.value)) return;
    o.projekty.push({ id: nid(), nazev: vstup.value.trim(), priorita: vyber.value, termin: datumP.value, ukoly: [] });
    formProjekt = null;
    uloz();
    vykresli();
  };
  const zrusit = el("button", "Zrušit", "", "btn");
  zrusit.onclick = function () { formProjekt = null; vykresli(); };
  f.append(vstup, radek, pridat, zrusit);
  return f;
}

function blokProjektu(o, i, p, j) {
  const pr = postup(p);
  const po = p.termin && p.termin < dnesKlic() && !(pr.n > 0 && pr.h === pr.n);
  const inb = o.inbox;

  const blok = el("div", "", "border-left:6px solid " + (inb ? "#8e8e93" : (PRIO_BARVA[p.priorita] || "#c7c7cc")), "panel projekt");
  blok.id = "p-" + i + "-" + j;

  const hl = el("div", "", "display:flex;align-items:center;gap:8px");
  if (inb) {
    hl.appendChild(el("div", "Nezatříděné akce", "flex:1;font-size:19px;font-weight:700"));
  } else if (prejmenovani === p) {
    hl.append.apply(hl, poleNazvu(p, "font-size:18px"));
  } else {
    hl.appendChild(el("div", p.nazev, "flex:1;min-width:0;font-size:19px;font-weight:700;word-break:break-word" + (po ? ";color:var(--cerv)" : "")));
    hl.append(
      ikona("✎", function () { prejmenovani = p; vykresli(); fokusPrejmenovani(); }),
      ikona("✕", function () { smazPrvek("Projekt „" + p.nazev + "“", o.projekty, p); })
    );
  }
  blok.appendChild(hl);

  const r2 = el("div", "", "display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 10px;font-size:15px;color:var(--sedy)");
  const sel = vyberPriority(p.priorita);
  sel.onchange = function () { p.priorita = sel.value; uloz(); vykresli(); };
  const dat = el("input", "", "", "mini");
  dat.type = "date";
  dat.value = p.termin || "";
  dat.onchange = function () {
    if (!souhlasProjekt(p, dat.value)) { vykresli(); return; }
    p.termin = dat.value;
    uloz();
    vykresli();
  };
  r2.append(sel, el("span", "hotovo do"), dat);
  if (!inb) {
    blok.appendChild(r2);

    const bar = el("div", "", "", "progress");
    bar.appendChild(el("div", "", "width:" + pr.proc + "%;background:" + (pr.proc === 100 ? "var(--zel)" : o.barva)));
    blok.appendChild(bar);
    const popisPostupu = pr.n ? pr.proc + " %  ·  " + pr.h + " z " + pr.n + " akcí hotovo" : "Zatím bez jednorázových akcí";
    blok.appendChild(el("div", popisPostupu + (pr.opak ? "  ·  🔁 " + pr.opak : ""), "font-size:13px;color:var(--sedy);margin:4px 0 6px"));
  }

  const nyni = nyniKlic();
  serazeneAkce(p).forEach(function (u) { blok.appendChild(radekAkce(p, u, nyni)); });

  const b = el("button", "＋ Akce", "", "btn");
  b.onclick = function () { otevriEditor(null, p); };
  blok.appendChild(b);
  if (!inb) {
    const bs = el("button", "📋 Uložit jako šablonu", "font-size:15px", "btn");
    bs.onclick = function () { ulozJakoSablonu(p); };
    blok.appendChild(bs);
  }
  return blok;
}

function radekAkce(p, u, nyni) {
  const obal = el("div", "", "", "polozka");
  const r = el("div", "", "display:flex;align-items:center;gap:10px;padding:9px 0");
  const den = zobrazenyDen(u);
  const hot = jeHotovo(u, den);
  const konecKlic = den ? den + " " + (u.konec || u.zacatek || "23:59") : "";
  const po = !hot && !jeOpak(u) && u.termin && konecKlic < nyni;

  const zamek = jeZablokovana(u);
  const text = el("div", "", "flex:1;min-width:0;cursor:pointer" + (zamek ? ";opacity:.55" : ""));
  text.appendChild(el("div", u.text + (u.popis ? " 📝" : ""), hot ? "text-decoration:line-through;color:var(--sedy2)" : ""));
  const casti = [];
  if (den) casti.push(datumCz(den) + (u.zacatek ? ", " + casText(u) : ""));
  if (jeOpak(u)) casti.push("🔁 " + opakPopis(u));
  if (u.podukoly.length) casti.push("☑ " + u.podukoly.filter(function (s) { return s.hotovo; }).length + "/" + u.podukoly.length);
  znacky(u).forEach(function (z) { casti.push(z); });
  if (casti.length) text.appendChild(el("div", casti.join(" · "), "font-size:14px;color:" + (po ? "var(--cerv)" : "var(--sedy2)")));
  text.onclick = function () { otevriEditor(u, p); };

  r.append(kolecko(hot, function () { prepniHotovo(u, den); uloz(); vykresli(); }), text);
  r.appendChild(ikona("✕", function () { smazPrvek("Akce „" + u.text + "“", p.ukoly, u); }));
  obal.appendChild(r);

  const pk = prekryvy(u, u, den);
  if (pk.length) {
    obal.appendChild(el("div", "⚠️ Překrývá se s: " + pk.join("; "), "font-size:14px;color:var(--oranz);padding:0 0 8px 36px"));
  }
  return obal;
}

/* =====================  EDITOR AKCE (OKNO)  ===================== */
function novaAkceData() {
  return {
    id: nid(), text: "", termin: "", zacatek: "", konec: "", popis: "", hotovo: false, hotoveDny: [],
    opak: { typ: "", do: "" }, podukoly: [], odhad: 0, energie: "", ceka: null, po: ""
  };
}

// u = upravovaná akce (null = nová akce), p = projekt, ve kterém je / do kterého se přidá
function otevriEditor(u, p) {
  editor = {
    u: u,
    p: p,
    cilP: p,
    novyPodukol: null,
    d: u ? JSON.parse(JSON.stringify(u)) : novaAkceData()
  };
  vykresliEditor();
}

function zavriEditor() {
  editor = null;
  vykresliEditor();
}

function ulozEditor() {
  const d = editor.d;
  if (d.text.trim() === "") { alert("Název akce nesmí být prázdný."); return; }
  d.text = d.text.trim();
  if (editor.novyPodukol && editor.novyPodukol.value.trim() !== "") {
    d.podukoly.push({ text: editor.novyPodukol.value.trim(), hotovo: false });
  }
  d.podukoly = d.podukoly.filter(function (s) { return s.text.trim() !== ""; });
  if (!d.opak.typ) d.opak.do = "";
  if (d.ceka && !String(d.ceka.kdo || "").trim()) d.ceka.kdo = "někoho";
  if (d.po === d.id) d.po = "";
  if (!potvrdAkci(d, editor.cilP, editor.u)) return;
  const u = editor.u;
  if (u) {
    if (editor.cilP !== editor.p) {
      editor.p.ukoly.splice(editor.p.ukoly.indexOf(u), 1);
      editor.cilP.ukoly.push(u);
    }
    Object.keys(d).forEach(function (k) { u[k] = d[k]; });
  } else {
    editor.cilP.ukoly.push(d);
  }
  editor = null;
  vykresliEditor();

/* =====================  PŘETAHOVÁNÍ (DRAG & DROP)  ===================== */
// Dlouhé podržení (dotyk) nebo tažení myší přesune akci na jiný den / čas
function povolDrag(elm, x, kliknuti) {
  let timer = null, aktivni = false, ghost = null, cilEl = null, puvOpacity = "";
  let sx = 0, sy = 0, by = 0, grabX = 0, offY = 0;

  function zacni(px, py) {
    aktivni = true;
    const r = elm.getBoundingClientRect();
    grabX = px - r.left;
    offY = py - r.top;
    puvOpacity = elm.style.opacity;
    ghost = elm.cloneNode(true);
    ghost.style.cssText += ";position:fixed;left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px;margin:0;opacity:.9;pointer-events:none;z-index:2000;box-shadow:0 8px 20px rgba(0,0,0,.35)";
    document.body.appendChild(ghost);
    elm.style.opacity = ".25";
    if (navigator.vibrate) navigator.vibrate(10);
  }
  function posun(px, py) {
    by = py;
    ghost.style.left = (px - grabX) + "px";
    ghost.style.top = (py - offY) + "px";
    const e = document.elementFromPoint(px, py);
    const c = e && e.closest ? e.closest("[data-den]") : null;
    if (c !== cilEl) {
      if (cilEl) cilEl.classList.remove("drop-cil");
      cilEl = c;
      if (cilEl) cilEl.classList.add("drop-cil");
    }
  }
  function uklid() {
    clearTimeout(timer);
    if (ghost) { ghost.remove(); ghost = null; }
    if (cilEl) cilEl.classList.remove("drop-cil");
    if (aktivni) elm.style.opacity = puvOpacity;
    aktivni = false;
  }
  function pust() {
    const c = cilEl, y = by, oy = offY, bylAktivni = aktivni;
    uklid();
    cilEl = null;
    if (bylAktivni && c) presun(x, c, y, oy);
  }

  elm.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    by = sy;
    clearTimeout(timer);
    timer = setTimeout(function () { zacni(sx, sy); }, 350);
  }, { passive: true });
  elm.addEventListener("touchmove", function (e) {
    const t = e.touches[0];
    if (!aktivni) {
      if (Math.abs(t.clientX - sx) > 8 || Math.abs(t.clientY - sy) > 8) clearTimeout(timer);
      return;
    }
    e.preventDefault();
    posun(t.clientX, t.clientY);
  }, { passive: false });
  elm.addEventListener("touchend", function (e) {
    clearTimeout(timer);
    if (aktivni) { e.preventDefault(); pust(); }
  });
  elm.addEventListener("touchcancel", uklid);

  elm.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    sx = e.clientX;
    sy = e.clientY;
    const pohyb = function (ev) {
      if (!aktivni) {
        if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6) return;
        zacni(sx, sy);
      }
      posun(ev.clientX, ev.clientY);
    };
    const pustMys = function () {
      document.removeEventListener("mousemove", pohyb);
      document.removeEventListener("mouseup", pustMys);
      if (aktivni) {
        blokKlik = true;
        setTimeout(function () { blokKlik = false; }, 80);
        pust();
      }
    };
    document.addEventListener("mousemove", pohyb);
    document.addEventListener("mouseup", pustMys);
  });

  elm.addEventListener("click", function (e) {
    e.stopPropagation();
    if (blokKlik) return;
    kliknuti();
  });
}

// c = cílový prvek s atributem data-den, py = svislá poloha prstu, offY = kde jsme akci chytili
function presun(x, c, py, offY) {
  const u = x.u, p = x.p;
  const novyDen = c.getAttribute("data-den");
  const d = JSON.parse(JSON.stringify(u));
  if (jeOpak(u)) {
    const posunDnu = rozdilDnu(x.den, novyDen);
    d.termin = pridejDny(u.termin, posunDnu);
    if (d.opak.do) d.opak.do = pridejDny(d.opak.do, posunDnu);
  } else {
    d.termin = novyDen;
  }
  if (c.hasAttribute("data-casova")) {
    const r = c.getBoundingClientRect();
    let min = Math.round(((py - offY - r.top) / HODINA * 60) / 15) * 15;
    min = Math.max(0, Math.min(min, 24 * 60 - 15));
    const delka = (u.zacatek && u.konec) ? minuty(u.konec) - minuty(u.zacatek) : (u.odhad || 0);
    d.zacatek = cas(min);
    d.konec = delka > 0 ? cas(Math.min(min + delka, 24 * 60 - 15)) : "";
    if (d.konec && d.konec <= d.zacatek) d.konec = "";
  } else if (c.hasAttribute("data-celyden")) {
    d.zacatek = "";
    d.konec = "";
  }
  if (d.termin === u.termin && d.zacatek === u.zacatek && d.konec === u.konec) return;
  if (jeOpak(u) && !confirm("Toto je opakující se akce. Přesunout celou řadu?")) return;
  if (!potvrdAkci(d, p, u)) return;
  Object.keys(d).forEach(function (k) { u[k] = d[k]; });
  uloz();
  vykresli();
}

function cip(x) {
  const zaklad = "font-size:11px;padding:1px 4px;margin-top:2px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";
  if (x.typ === "projekt") {

    c.onclick = function (e) { e.stopPropagation(); otevri(x.i, x.j); };
    return c;
  }
  const u = x.u;
  const hot = jeHotovo(u, x.den);
  const konflikt = prekryvy(u, u, x.den).length > 0 ? "⚠️ " : "";
  const text = konflikt + (u.zacatek ? u.zacatek + " " : "") + u.text + (jeOpak(u) ? " 🔁" : "");
  const c = el("div", text, zaklad + "background:" + x.o.barva + ";color:" + textBarva(x.o.barva) +

  povolDrag(c, x, function () { otevriEditor(u, x.p); });
  return c;
}

// Rozloží překrývající se akce vedle sebe
function rozloz(polozky) {
  const ev = polozky.map(function (x) {
    const s = minuty(x.u.zacatek);
    const e = x.u.konec ? minuty(x.u.konec) : s + (x.u.odhad || 30);
    return { x: x, s: s, e: Math.max(e, s + 15), sl: 0, n: 1 };
  }).sort(function (a, b) { return a.s - b.s || a.e - b.e; });
  let skupina = [], konecSk = -1;
  function uzavri() {
    const max = skupina.reduce(function (m, v) { return Math.max(m, v.sl + 1); }, 1);
    skupina.forEach(function (v) { v.n = max; });
    skupina = [];
  }
  ev.forEach(function (v) {
    if (skupina.length && v.s >= konecSk) { uzavri(); konecSk = -1; }
    const obsazene = skupina.filter(function (w) { return w.e > v.s; }).map(function (w) { return w.sl; });
    let sl = 0;
    while (obsazene.indexOf(sl) !== -1) sl++;
    v.sl = sl;
    skupina.push(v);
    konecSk = Math.max(konecSk, v.e);
  });
  if (skupina.length) uzavri();
  return ev;
}
